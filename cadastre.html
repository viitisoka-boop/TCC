<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastre-se</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #91c794;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 470px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(11, 44, 23, 0.15);
        }

        .logo {
            color: #145A32;
            font-size: 23px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
        }

        .logo i {
            margin-right: 6px;
        }

        h1 {
            color: #145A32;
            font-size: 26px;
            text-align: center;
            margin-bottom: 8px;
        }

        .descricao {
            color: #666;
            font-size: 13px;
            text-align: center;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 17px;
        }

        .campo label {
            display: block;
            color: #145A32;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .campo input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 9px;
            outline: none;
            font-size: 13px;
        }

        .campo input:focus {
            border-color: #5b8f5e;
        }

        .senha {
            position: relative;
        }

        .senha input {
            padding-right: 42px;
        }

        .senha i {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
        }

        .botao {
            width: 100%;
            padding: 13px;
            background-color: #145A32;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.3s;
        }

        .botao:hover {
            background-color: #1d7543;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #666;
        }

        .login a {
            color: #145A32;
            font-weight: 600;
            text-decoration: none;
        }

        .login a:hover {
            text-decoration: underline;
        }

        #mensagem {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #145A32;
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 23px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            PULSO VERDE
        </div>

        <h1>Crie sua conta!</h1>

        <p class="descricao">
            Cadastre-se e faça parte da proteção animal.
        </p>

        <form onsubmit="cadastrar(event)">

            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome"
                    placeholder="Digite seu nome completo" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email"
                    placeholder="Digite seu e-mail" required>
            </div>

            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf"
                    placeholder="000.000.000-00"
                    maxlength="14" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="senha">
                    <input type="password" id="senha"
                        placeholder="Crie uma senha" required>
                    <i class="fa-solid fa-eye"
                        onclick="mostrarSenha('senha', this)"></i>
                </div>
            </div>

            <div class="campo">
                <label for="confirmar">Confirmar senha</label>
                <div class="senha">
                    <input type="password" id="confirmar"
                        placeholder="Digite sua senha novamente" required>
                    <i class="fa-solid fa-eye"
                        onclick="mostrarSenha('confirmar', this)"></i>
                </div>
            </div>

            <button type="submit" class="botao">
                Criar minha conta
            </button>

        </form>

        <p id="mensagem"></p>

        <p class="login">
            Já possui uma conta?
            <a href="login.html">Entrar</a>
        </p>

    </div>

    <script>
        function mostrarSenha(id, icone) {
            let campo = document.getElementById(id);

            if (campo.type === "password") {
                campo.type = "text";
                icone.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                campo.type = "password";
                icone.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        document.getElementById("cpf").addEventListener("input", function () {
            let cpf = this.value.replace(/\D/g, "").slice(0, 11);

            cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
            cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
            cpf = cpf.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

            this.value = cpf;
        });

        function cadastrar(event) {
            event.preventDefault();

            let senha = document.getElementById("senha").value;
            let confirmar = document.getElementById("confirmar").value;
            let cpf = document.getElementById("cpf").value.replace(/\D/g, "");

            if (cpf.length !== 11) {
                document.getElementById("mensagem").innerText =
                    "Digite um CPF com 11 números.";
                return;
            }

            if (senha.length < 6) {
                document.getElementById("mensagem").innerText =
                    "A senha deve ter pelo menos 6 caracteres.";
                return;
            }

            if (senha !== confirmar) {
                document.getElementById("mensagem").innerText =
                    "As senhas não são iguais.";
                return;
            }

            document.getElementById("mensagem").innerText =
                "Cadastro preenchido.";
        }
    </script>

</body>
</html>

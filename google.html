<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar com Google</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #91c794;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 450px;
            padding: 45px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(11, 44, 23, 0.15);
            text-align: center;
        }

        .logo {
            color: #145A32;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .icone {
            font-size: 55px;
            color: #4285F4;
            margin-bottom: 20px;
        }

        h1 {
            color: #145A32;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .descricao {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .google-button {
            width: 100%;
            padding: 13px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            color: #444;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.3s;
        }

        .google-button:hover {
            background-color: #f5f5f5;
        }

        .google-button img {
            width: 22px;
            height: 22px;
        }

        .voltar {
            display: inline-block;
            margin-top: 25px;
            color: #145A32;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .container {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            <i class="fa-solid fa-paw"></i>
            PULSO VERDE
        </div>

        <h1>Entrar com Google</h1>

        <p class="descricao">
            Acesse sua conta do Pulso Verde utilizando seu e-mail
            do Google de maneira simples e prática.
        </p>

        <button class="google-button" onclick="entrarGoogle()">
            <i class="fa-brands fa-google"></i>
            Continuar com Google
        </button>

        <a href="login.html" class="voltar">
            <i class="fa-solid fa-arrow-left"></i>
            Voltar para o login
        </a>

    </div>

    <script>
        function entrarGoogle() {
            alert("Enviamos um link para o seu e-mail.");
        }
    </script>

</body>
</html>
